[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dadhep-backend"
version = "0.1.0"
description = "Dadhep Tibetan audio book AWS backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "pydantic-settings>=2.7,<3",
  "boto3>=1.35,<2",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "PyMuPDF>=1.25,<2",
  "mutagen>=1.47,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
